<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый проект</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <div class="header__wrap">
                <a href="index.html" class="logo">RemCom</a>
                <nav class="menu js-menu">
                    <ul>
                        <li><a href="reviews.html">Отзывы</a></li>
                        <li><a href="faq.html">FAQ</a></li>
                        <li><a href="contacts.html">Контакты</a></li>
                        <li><a href="works.html">Наши работы</a></li>
                    </ul>
                    <a href="tel:78128888888" class="phone phone--mobile">+7 812 888-88-88</a>
                </nav>
                <a href="tel:78128888888" class="phone">+7 812 888-88-88</a>
                <button class="burger js-burger">
                    Menu
                </button>
            </div>
        </div>
    </header>
    <main>
        <section class="contacts">
            <div class="contacts__inner">
                <h1 class="contacts__title">Сервисные центры</h1>
                <ul class="filter">
                    <li class="filter__item"><a href="#" class="contacts__link active">Санкт-Петербург</a></li>
                    <li class="filter__item"><a href="#" class="contacts__link">Москва</a></li>
                    <li class="filter__item"><a href="#" class="contacts__link">Екатеринбург</a></li>
                </ul>

                <div class="contacts__tab active">Санкт-Петербург</div>
                <div class="contacts__tab">Москва</div>
                <div class="contacts__tab">Екатеринбург</div>
            </div>
        </section>

        <section class="order">
            <div class="order__inner">
                <h2 class="order__title">
                    Заявка на ремонт
                </h2>

                <form action="" class="form-order">
                    <div class="form-order__field form-order__field--half">
                        <label for="name" class="form-order__label">Имя</label>
                        <input name="name" id="name" type="text" class="form-order__input">
                    </div>

                    <div class="form-order__field form-order__field--half">
                        <label for="phone" class="form-order__label">Телефон</label>
                        <input name="phone" id="phone" type="tel" class="form-order__input">
                    </div>

                    <div class="form-order__field">
                        <label for="area" class="form-order__label">Что ремонтируем?</label>
                        <textarea name="description" id="area" class="form-order__textarea"></textarea>
                    </div>

                    <div class="form-order__field">
                        <input name="confirm" id="confirm" type="checkbox" class="form-order__checkbox">
                        <label for="confirm" class="form-order__label-checkbox">
                            <span>Даю согласие на обработку персональных данных с соответствии с <a href="#">политикой
                                    обработки
                                    персональных данных</a></span>
                        </label>
                    </div>

                    <div class="form-order__field">
                        <button type="submit" class="btn btn--full">Отправить</button>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__wrap">
                <p class="copyrigt">Ничего не защищено</p>

                <ul class="social-icons">
                    <li class="social-icons__item">
                        <a href="" class="social-icons__link social-icons__link--teleg"
                            title="Наш канал в телеграмм"></a>
                    </li>
                    <li class="social-icons__item">
                        <a href="" class="social-icons__link social-icons__link--face"></a>
                    </li>
                    <li class="social-icons__item">
                        <a href="" class="social-icons__link social-icons__link--inst"></a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="scripts/script.js"></script>
</body>

</html>
